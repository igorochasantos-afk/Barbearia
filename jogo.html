<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setas</title>
<style>
:root{--bg:#cdebf5;--ink:#2b4a66;--dot:rgba(43,74,102,.25);--card:#fff;--red:#ff5a4f;--off:rgba(0,0,0,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10202b;--ink:#9fc4e0;--dot:rgba(159,196,224,.25);--card:#1d3342;--off:rgba(255,255,255,.15)}}
:root[data-theme="dark"]{--bg:#10202b;--ink:#9fc4e0;--dot:rgba(159,196,224,.25);--card:#1d3342;--off:rgba(255,255,255,.15)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#hearts{margin-top:14px;font-size:34px;letter-spacing:8px;line-height:1}
#hearts span{color:var(--red)}#hearts span.off{color:var(--off)}
#lvl{font-size:22px;font-weight:600;margin:6px 0}
#wrap{flex:1;width:100%;min-height:0}
canvas{width:100%;height:100%;display:block}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 28px;background:#f9a800;color:#fff;margin:14px 0 18px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#card{background:var(--card);border-radius:18px;padding:24px 28px;text-align:center;max-width:80%}
#card h2{margin:0 0 6px}#card button{margin:12px 0 0}
</style>
</head>
<body>
<div id="app">
<div id="hearts"></div>
<div id="lvl"></div>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="hintBtn">💡 Dica</button>
</div>
<div id="ov"><div id="card"><h2 id="ovT"></h2><button id="ovB"></button></div></div>
<script>
const K=(x,y)=>x+','+y;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rayCells(a,cols,rows){const r=[];let x=a.pts[a.pts.length-1][0]+a.dx,y=a.pts[a.pts.length-1][1]+a.dy;
while(x>=0&&x<cols&&y>=0&&y<rows){r.push(K(x,y));x+=a.dx;y+=a.dy}return r}
function maxDepth(as,cols,rows){const owner=new Map();as.forEach((a,i)=>a.pts.forEach(p=>owner.set(K(p[0],p[1]),i)));
const bl=as.map(a=>{const s=new Set();rayCells(a,cols,rows).forEach(c=>{if(owner.has(c))s.add(owner.get(c))});return s});
const memo=[];const d=i=>{if(memo[i]!==undefined)return memo[i];let b=0;for(const j of bl[i])b=Math.max(b,d(j));return memo[i]=1+b};
let r=0;for(let i=0;i<as.length;i++)r=Math.max(r,d(i));return r}
function tryArrow(r,cols,rows,maxLen,occ){
const sx=Math.floor(r()*cols),sy=Math.floor(r()*rows);if(occ.has(K(sx,sy)))return null;
const len=2+Math.floor(r()*(maxLen-1));const pts=[[sx,sy]];const D=[[1,0],[-1,0],[0,1],[0,-1]];let dir=null;
while(pts.length<len){const[lx,ly]=pts[pts.length-1];
const opts=D.filter(([dx,dy])=>{const x=lx+dx,y=ly+dy;return x>=0&&x<cols&&y>=0&&y<rows&&!occ.has(K(x,y))&&!pts.some(p=>p[0]===x&&p[1]===y)});
if(!opts.length)break;
const keep=dir&&opts.some(o=>o[0]===dir[0]&&o[1]===dir[1])&&r()<.6;
dir=keep?dir:opts[Math.floor(r()*opts.length)];pts.push([lx+dir[0],ly+dir[1]])}
if(pts.length<2)return null;return{pts,dx:dir[0],dy:dir[1]}}
function generate(n){const r=rng(n*7919+13);const br=n%6===0;const t=Math.min(n,30)/30;
const cols=5+Math.round(t*5)-(br?1:0),rows=7+Math.round(t*7)-(br?2:0);
const maxChain=Math.min(7,Math.max(2,2+Math.floor(n/5)))-(br?1:0);const maxLen=3+Math.round(t*5);
const target=Math.round(cols*rows*.2);const arrows=[],occ=new Set();
for(let i=0;i<8000&&arrows.length<target;i++){const a=tryArrow(r,cols,rows,maxLen,occ);if(!a)continue;
const ray=rayCells(a,cols,rows);const own=new Set(a.pts.map(p=>K(p[0],p[1])));
if(ray.some(c=>occ.has(c)||own.has(c)))continue;
arrows.push(a);if(maxDepth(arrows,cols,rows)>maxChain){arrows.pop();continue}
own.forEach(c=>occ.add(c))}
return{cols,rows,arrows}}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let lv,gone,lives,levelNo=1,flash=-1,hint=-1,cell,ox,oy,W,H,last=0,running=false;const anim=new Map();
try{const s=parseInt(localStorage.getItem('setas_level'));if(s>0)levelNo=s}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pos=(x,y)=>[ox+x*cell,oy+y*cell];
function resize(){const d=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;W=w;H=h;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);geo();draw()}
function geo(){if(!lv)return;cell=Math.min((W-48)/(lv.cols-1),(H-48)/(lv.rows-1));ox=(W-cell*(lv.cols-1))/2;oy=(H-cell*(lv.rows-1))/2}
function ui(){document.getElementById('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<lives?'':'off'}">♥</span>`).join('');
document.getElementById('lvl').textContent='Nível '+levelNo}
function load(n){levelNo=n;lv=generate(n);gone=lv.arrows.map(()=>false);anim.clear();lives=3;flash=hint=-1;
try{localStorage.setItem('setas_level',n)}catch(e){}geo();ui();draw()}
function free(i){const occ=new Set();lv.arrows.forEach((a,j)=>{if(!gone[j]&&j!==i)a.pts.forEach(p=>occ.add(K(p[0],p[1])))});
return rayCells(lv.arrows[i],lv.cols,lv.rows).every(c=>!occ.has(c))}
function win(poly,a,b){const out=[];let acc=0;for(let i=0;i<poly.length-1;i++){const p=poly[i],q=poly[i+1];
const l=Math.hypot(q[0]-p[0],q[1]-p[1]);const s0=acc,s1=acc+l;
if(l>0&&s1>a&&s0<b){const ta=(Math.max(a,s0)-s0)/l,tb=(Math.min(b,s1)-s0)/l;
const pa=[p[0]+(q[0]-p[0])*ta,p[1]+(q[1]-p[1])*ta],pb=[p[0]+(q[0]-p[0])*tb,p[1]+(q[1]-p[1])*tb];
if(!out.length||Math.hypot(out[out.length-1][0]-pa[0],out[out.length-1][1]-pa[1])>.01)out.push(pa);out.push(pb)}acc=s1}
return out}
function draw(){if(!lv)return;ctx.clearRect(0,0,W,H);const ink=css('--ink');ctx.fillStyle=css('--dot');
for(let x=0;x<lv.cols;x++)for(let y=0;y<lv.rows;y++){const[px,py]=pos(x,y);ctx.beginPath();ctx.arc(px,py,2.5,0,7);ctx.fill()}
lv.arrows.forEach((a,i)=>{if(gone[i]&&!anim.has(i))return;
const col=i===flash?'#e53935':i===hint?'#f9a800':ink;let poly=a.pts.map(p=>pos(p[0],p[1]));
if(anim.has(i)){let bl=0;for(let k=0;k<poly.length-1;k++)bl+=Math.hypot(poly[k+1][0]-poly[k][0],poly[k+1][1]-poly[k][1]);
const ray=rayCells(a,lv.cols,lv.rows).length,travel=cell*(ray+1)+bl,h=poly[poly.length-1];
const t=Math.pow(Math.min(1,anim.get(i)),2),s=t*travel;poly=win(poly.concat([[h[0]+a.dx*travel,h[1]+a.dy*travel]]),s,s+bl);
if(poly.length<2)return}
ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let k=1;k<poly.length;k++)ctx.lineTo(poly[k][0],poly[k][1]);ctx.stroke();
const tip=poly[poly.length-1],ux=a.dx,uy=a.dy,nx=-uy,ny=ux,s=cell*.28;
ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(tip[0]-ux*s+nx*s*.6,tip[1]-uy*s+ny*s*.6);
ctx.lineTo(tip[0]-ux*s-nx*s*.6,tip[1]-uy*s-ny*s*.6);ctx.closePath();ctx.fill()})}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
for(const[k,v]of anim){const nv=v+dt/.5;if(nv>=1)anim.delete(k);else anim.set(k,nv)}draw();
if(anim.size)requestAnimationFrame(loop);else{running=false;if(gone.every(Boolean))overlay('Nível '+levelNo+' concluído!','Próximo nível',()=>load(levelNo+1))}}
function kick(){if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}}
function overlay(t,b,f){document.getElementById('ovT').textContent=t;const o=document.getElementById('ov'),btn=document.getElementById('ovB');
btn.textContent=b;btn.onclick=()=>{o.style.display='none';f()};o.style.display='flex'}
cv.addEventListener('pointerdown',e=>{if(document.getElementById('ov').style.display==='flex')return;
const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let best=-1,bd=cell*.45;
lv.arrows.forEach((a,i)=>{if(gone[i])return;const P=a.pts.map(p=>pos(p[0],p[1]));
for(let k=0;k<P.length-1;k++){const[ax,ay]=P[k],[bx,by]=P[k+1],dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
const t=l2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)):0;const d=Math.hypot(px-(ax+dx*t),py-(ay+dy*t));
if(d<bd){bd=d;best=i}}});
if(best<0)return;
if(free(best)){gone[best]=true;anim.set(best,0);hint=-1;kick()}
else{flash=best;lives--;ui();draw();setTimeout(()=>{flash=-1;draw()},300);
if(lives<=0)overlay('Sem vidas','Tentar de novo',()=>load(levelNo))}});
document.getElementById('hintBtn').onclick=()=>{for(let i=0;i<lv.arrows.length;i++)if(!gone[i]&&free(i)){hint=i;draw();setTimeout(()=>{hint=-1;draw()},1500);return}};
window.addEventListener('resize',resize);
load(levelNo);resize();
</script>
</body>
</html>
